blueprint:
  name: Run Device During Cheapest Hours
  description: >-
    Turn a device on when the current hour belongs to the cheapest hours of
    the day, and off otherwise. Uses a binary sensor from the
    energy_price_calculator integration (e.g. goedkoopste_10_van_de_dag).
    Optionally, the device only runs while a presence sensor indicates it is
    home (e.g. the EV), and extra conditions can be set, e.g. only charge
    when the EV cable is plugged in.
  domain: automation
  author: Maarten Meijer (@MaartenMJR)
  source_url: https://github.com/MI-Services/energy-price-calculator/blob/main/blueprints/automation/energy_price_calculator/run_device_during_cheapest_hours.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    cheap_hour_sensor:
      name: Cheap hour sensor
      description: >-
        The binary sensor from energy_price_calculator that turns ON during
        the cheapest hours (e.g. binary_sensor.goedkoopste_10_van_de_dag).
      selector:
        entity:
          domain: binary_sensor
    device_switch:
      name: Device switch
      description: The switch that controls the appliance.
      selector:
        target:
          entity:
            domain: switch
    presence_sensor:
      name: Presence sensor (optional)
      description: >-
        Entity that indicates the device (e.g. the EV) is home: a
        device_tracker or person (state 'home') or a binary_sensor (state
        'on'). The device only runs during cheap hours while this sensor is
        'home'/'on'; arriving home or leaving immediately re-evaluates the
        switch. Leave empty to always allow running.
      default: ""
      selector:
        entity:
          domain:
            - device_tracker
            - person
            - binary_sensor
    extra_conditions:
      name: Extra conditions (optional)
      description: >-
        Extra conditions that must also be met before the device is switched
        on. Examples: EV charging only when the charging cable is plugged in
        (state condition on the plug sensor), or a heat pump only when the
        average outdoor temperature is below a threshold (numeric state
        condition). Leave empty to always switch on during the cheap hours.
      default: []
      selector:
        condition:

mode: single
max_exceeded: silent

trigger_variables:
  presence_sensor_tv: !input presence_sensor

variables:
  cheap_hour_sensor_var: !input cheap_hour_sensor
  presence_sensor_var: !input presence_sensor
  is_cheap: >-
    {{ states(cheap_hour_sensor_var) == 'on' }}
  car_home: >-
    {{ presence_sensor_var == '' or is_state(presence_sensor_var, ['home', 'on']) }}

triggers:
  - trigger: state
    entity_id: !input cheap_hour_sensor
    id: sensor_changed
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: template
    value_template: >-
      {{ presence_sensor_tv != '' and is_state(presence_sensor_tv, ['home', 'on']) }}
    id: presence_arrived
  - trigger: template
    value_template: >-
      {{ presence_sensor_tv != '' and not is_state(presence_sensor_tv, ['home', 'on']) }}
    id: presence_left

actions:
  - if:
      - condition: !input extra_conditions
      - condition: template
        value_template: "{{ is_cheap and car_home }}"
    then:
      - action: homeassistant.turn_on
        target: !input device_switch
    else:
      - action: homeassistant.turn_off
        target: !input device_switch
