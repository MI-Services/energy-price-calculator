# Standard dashboard definition for the Energy Price Calculator integration.
#
# Shipped in this repo so the MI customer provisioning (dynamic-energy-pricing)
# can fetch the pinned version from the installed integration release and create
# the dashboard through the Lovelace websocket API in storage mode:
# FIRST lovelace/dashboards/create with url_path "energy-price-calculator"
# (registering title/sidebar/url), THEN lovelace/config/save with the SAME
# url_path to store the views. config/save without url_path targets the default
# dashboard; an unregistered url_path returns config_not_found. Never create it
# via a lovelace: block in configuration.yaml (YAML-mode dashboards are on the
# deprecation path).
#
# This file contains GENERIC views only - no customer-specific data. The
# per-customer "dagrapport" view (hosted rapport.svg + notifications) is added
# by the MI provisioning and is intentionally not part of this file.
#
# Naming decision (18 nov 2026): dashboard title "Energy Price Calculator", url
# path "energy-price-calculator". Visible tab titles are Dutch and
# self-explanatory; no "EPC"/"EMS"/"Showroom" abbreviations anywhere visible.
#
# 21 nov 2026: the "Prijsgolf" view was removed - the data was redundant with
# the Prijssensoren view and the chart was not helpful. This also removes the
# ApexCharts (Marketplace) dependency, so no custom-card requirement remains.

title: Energy Price Calculator
icon: mdi:currency-eur
show_in_sidebar: true
views:
  - title: Prijssensoren
    path: prijssensoren
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: "Energy Price Calculator: prijzen en categorieen"
            icon: mdi:currency-eur
          - type: entities
            title: Uurprijzen 00:00 t/m 11:00
            entities:
              - sensor.uurprijs_00_00
              - sensor.uurprijs_01_00
              - sensor.uurprijs_02_00
              - sensor.uurprijs_03_00
              - sensor.uurprijs_04_00
              - sensor.uurprijs_05_00
              - sensor.uurprijs_06_00
              - sensor.uurprijs_07_00
              - sensor.uurprijs_08_00
              - sensor.uurprijs_09_00
              - sensor.uurprijs_10_00
              - sensor.uurprijs_11_00
          - type: entities
            title: Uurprijzen 12:00 t/m 23:00
            entities:
              - sensor.uurprijs_12_00
              - sensor.uurprijs_13_00
              - sensor.uurprijs_14_00
              - sensor.uurprijs_15_00
              - sensor.uurprijs_16_00
              - sensor.uurprijs_17_00
              - sensor.uurprijs_18_00
              - sensor.uurprijs_19_00
              - sensor.uurprijs_20_00
              - sensor.uurprijs_21_00
              - sensor.uurprijs_22_00
              - sensor.uurprijs_23_00
          - type: entities
            title: Goedkoopste uren morgen
            entities: [sensor.goedkoopste_uren_morgen_10, sensor.goedkoopste_uren_morgen_20, sensor.goedkoopste_uren_morgen_30, sensor.goedkoopste_uren_morgen_40, sensor.goedkoopste_uren_morgen_50, sensor.goedkoopste_uren_morgen_60, sensor.goedkoopste_uren_morgen_70, sensor.goedkoopste_uren_morgen_80, sensor.goedkoopste_uren_morgen_90]

  - title: Schakelpercentage
    path: schakelpercentage
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: "Schakelpercentage (10-90%): mag een apparaat nu draaien?"
            icon: mdi:toggle-switch
          - type: grid
            columns: 3
            square: false
            cards:
                - type: tile
                  entity: binary_sensor.goedkoopste_10_van_de_dag
                  name: "10%"
                  icon: mdi:percent
                - type: tile
                  entity: binary_sensor.goedkoopste_20_van_de_dag
                  name: "20%"
                  icon: mdi:percent
                - type: tile
                  entity: binary_sensor.goedkoopste_30_van_de_dag
                  name: "30%"
                  icon: mdi:percent
                - type: tile
                  entity: binary_sensor.goedkoopste_40_van_de_dag
                  name: "40%"
                  icon: mdi:percent
                - type: tile
                  entity: binary_sensor.goedkoopste_50_van_de_dag
                  name: "50%"
                  icon: mdi:percent
                - type: tile
                  entity: binary_sensor.goedkoopste_60_van_de_dag
                  name: "60%"
                  icon: mdi:percent
                - type: tile
                  entity: binary_sensor.goedkoopste_70_van_de_dag
                  name: "70%"
                  icon: mdi:percent
                - type: tile
                  entity: binary_sensor.goedkoopste_80_van_de_dag
                  name: "80%"
                  icon: mdi:percent
                - type: tile
                  entity: binary_sensor.goedkoopste_90_van_de_dag
                  name: "90%"
                  icon: mdi:percent
          - type: markdown
            content: >-
              Elke aan/uit-sensor geeft aan of het huidige uur binnen de
              goedkoopste x% van de dag valt. Handig om een apparaat
              automatisch te laten draaien: gebruik de sensor als trigger in
              een automatisering, bijvoorbeeld "wasmachine aan zodra het
              goedkoopste 20% blok actief is".
